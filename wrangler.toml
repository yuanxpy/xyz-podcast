name = "xyz-podcast"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/__scheduled"]

[[d1_databases]]
binding = "DB"
database_name = "xyz-podcast-db"
database_id = "ac8cb49c-1792-460f-ab5b-731a0074a5bc"
migrations_dir = "migrations"

[triggers]
crons = ["*/2 0,12 * * *"]
